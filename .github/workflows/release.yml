name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Prepare frontend
        run: |
          ls -la
          if [ -d "virtualis-frontend" ]; then echo "monorepo frontend found"; ls -la virtualis-frontend | head -n 20; fi
          if [ -d "../virtualis-frontend" ]; then echo "sibling frontend found"; ls -la ../virtualis-frontend | head -n 20; fi
          # standalone: clone frontend if missing
          if [ ! -d "virtualis-frontend" ] && [ ! -d "../virtualis-frontend" ] && [ ! -d "/tmp/virtualis-frontend" ]; then
            echo "Cloning virtualis-frontend for standalone build..."
            git clone https://github.com/SakuraOpenSource/virtualis-frontend.git /tmp/virtualis-frontend || true
            ls -la /tmp/virtualis-frontend 2>/dev/null | head -n 20 || true
          fi
          # also try to ensure internal/web/dist exists
          mkdir -p internal/web/dist 2>/dev/null || true

      - name: Build frontend
        run: |
          FRONT=""
          if [ -d "virtualis-frontend" ]; then FRONT="virtualis-frontend"
          elif [ -d "../virtualis-frontend" ]; then FRONT="../virtualis-frontend"
          elif [ -d "/tmp/virtualis-frontend" ]; then FRONT="/tmp/virtualis-frontend"
          fi
          if [ -z "$FRONT" ]; then echo "No frontend, skipping"; exit 0; fi
          echo "Building frontend at $FRONT"
          cd "$FRONT"
          pnpm install --frozen-lockfile
          pnpm build
          if [ -d "$GITHUB_WORKSPACE/internal/web" ]; then
            rm -rf "$GITHUB_WORKSPACE/internal/web/dist"
            mkdir -p "$GITHUB_WORKSPACE/internal/web/dist"
            cp -R dist/. "$GITHUB_WORKSPACE/internal/web/dist/"
            echo "Injected to $GITHUB_WORKSPACE/internal/web/dist"
          elif [ -d "$GITHUB_WORKSPACE/virtualis/internal/web" ]; then
            rm -rf "$GITHUB_WORKSPACE/virtualis/internal/web/dist"
            mkdir -p "$GITHUB_WORKSPACE/virtualis/internal/web/dist"
            cp -R dist/. "$GITHUB_WORKSPACE/virtualis/internal/web/dist/"
          fi
          ls -lh "$GITHUB_WORKSPACE/internal/web/dist" 2>/dev/null | head -n 20 || true
          ls -lh "$GITHUB_WORKSPACE/virtualis/internal/web/dist" 2>/dev/null | head -n 20 || true

      - name: Ensure web dist
        run: |
          if [ -d "internal/web/dist" ] && [ "$(ls -A internal/web/dist 2>/dev/null)" ]; then echo "frontend injected"; ls -lh internal/web/dist | head -n 20
          else mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep; echo "empty dist"; fi

      - name: Build all platforms
        run: |
          chmod +x build_virtualis.sh
          bash build_virtualis.sh --no-frontend --all
          echo "=== bin ==="; ls -lh bin/ | head -n 40
          if [ -d "../virtualis-agent/bin" ]; then echo "=== agent ==="; ls -lh ../virtualis-agent/bin/ | head -n 20 || true; fi

      - name: Checksums
        run: |
          cd bin
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            bin/*
            bin/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
