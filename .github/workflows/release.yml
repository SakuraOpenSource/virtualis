name: Release

# Two ways to trigger:
#   - Manual: fill in the release tag on the Actions page; the tag is
#     created on the current commit when it does not exist yet.
#   - Tag push: `git tag v1.0.0 && git push --tags`.
#
# Tag shape decides the release kind:
#   - v1.2.3            -> stable release
#   - v1.2.3-rc.1       -> pre-release (GitHub "Pre-release" flag set)
#
# Release notes scope:
#   - pre-release: every commit since the last release of ANY kind
#   - stable:      every commit since the last STABLE release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.0 (created on the current commit if missing)"
        required: false
        type: string
      prerelease:
        description: "Force a pre-release (tags with a suffix are always pre-releases)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Trigger sources differ, so normalize first; later steps only read
      # these outputs. Inputs travel through env instead of being spliced
      # into the script, so quotes in an input cannot break the command.
      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          # case takes the first matching pattern and "*" eats suffixes like
          # case takes the first matching pattern and "*" eats suffixes like
          # "-rc.1", so the suffixed (pre-release) pattern must come first.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*-*)
              prerelease=true ;;
            v[0-9]*.[0-9]*.[0-9]*)
              prerelease=false ;;
            *)
              echo "Tag must look like v1.2.3 (stable) or v1.2.3-rc.1 (pre-release), got: $tag"
              exit 1 ;;
          esac
          # The manual checkbox can force a stable tag out as a pre-release.
          if [ "$INPUT_PRERELEASE" = "true" ]; then
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease: $prerelease)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare frontend
        run: |
          if [ -d "virtualis-frontend" ]; then echo "monorepo frontend found"; fi
          if [ -d "../virtualis-frontend" ]; then echo "sibling frontend found"; fi
          # Standalone checkout: clone the frontend when it is missing.
          if [ ! -d "virtualis-frontend" ] && [ ! -d "../virtualis-frontend" ] && [ ! -d "/tmp/virtualis-frontend" ]; then
            echo "Cloning virtualis-frontend for standalone build..."
            git clone https://github.com/SakuraOpenSource/virtualis-frontend.git /tmp/virtualis-frontend || true
          fi
          mkdir -p internal/web/dist

      - name: Build frontend
        continue-on-error: true
        run: |
          FRONT=""
          if [ -d "virtualis-frontend" ]; then FRONT="virtualis-frontend"
          elif [ -d "../virtualis-frontend" ]; then FRONT="../virtualis-frontend"
          elif [ -d "/tmp/virtualis-frontend" ]; then FRONT="/tmp/virtualis-frontend"
          fi
          if [ -z "$FRONT" ]; then echo "No frontend available, skipping"; exit 0; fi
          echo "Building frontend at $FRONT"
          cd "$FRONT"
          pnpm install --frozen-lockfile || pnpm install
          pnpm build || { echo "frontend build failed, continuing with empty dist"; exit 0; }
          if [ -d "$GITHUB_WORKSPACE/internal/web" ]; then
            rm -rf "$GITHUB_WORKSPACE/internal/web/dist"
            mkdir -p "$GITHUB_WORKSPACE/internal/web/dist"
            cp -R dist/. "$GITHUB_WORKSPACE/internal/web/dist/"
            echo "Injected into $GITHUB_WORKSPACE/internal/web/dist"
          elif [ -d "$GITHUB_WORKSPACE/virtualis/internal/web" ]; then
            rm -rf "$GITHUB_WORKSPACE/virtualis/internal/web/dist"
            mkdir -p "$GITHUB_WORKSPACE/virtualis/internal/web/dist"
            cp -R dist/. "$GITHUB_WORKSPACE/virtualis/internal/web/dist/"
          fi

      - name: Ensure web dist exists
        run: |
          if [ -d "internal/web/dist" ] && [ "$(ls -A internal/web/dist 2>/dev/null)" ]; then
            echo "frontend injected"
          else
            mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
            echo "empty dist"
          fi

      # Categorize commits by Conventional Commits prefix via the shared
      # script. Runs before the build: broken history should fail fast,
      # not after ten minutes of compiling.
      - name: Generate release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            bash scripts/release_notes.sh "$TAG" any > release-notes.md
          else
            bash scripts/release_notes.sh "$TAG" stable > release-notes.md
          fi
          cat release-notes.md

      - name: Build all platforms
        run: |
          chmod +x build_virtualis.sh
          bash build_virtualis.sh --no-frontend --all
          echo "=== bin ==="; ls -lh bin/ | head -n 40
          if [ -d "../virtualis-agent/bin" ]; then echo "=== agent ==="; ls -lh ../virtualis-agent/bin/ | head -n 20 || true; fi

      - name: Generate checksums
        run: |
          cd bin
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      # When the tag does not exist yet, this step creates it on
      # target_commitish, so manual runs do not need a pre-pushed tag.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release-notes.md
          files: |
            bin/*
            bin/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
